<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price tracker</title><style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--card:#f5f5f7;--line:#dcdce0;
--accent:#2563eb;--good:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f4;--muted:#a0a0a8;
--card:#212124;--line:#3a3a3f;--accent:#60a5fa;--good:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);
font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
.head,summary{display:grid;grid-template-columns:minmax(0,2.2fr) 1fr 1fr 1fr;gap:12px;
align-items:center;padding:12px 16px}
.head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary .name::before{content:"▸";display:inline-block;width:1.1em;color:var(--muted)}
details[open] summary .name::before{content:"▾"}
.name{font-weight:600}.shop{color:var(--muted);font-size:12px;font-weight:400}
.up{color:var(--bad)}.down{color:var(--good)}.badge{background:var(--good);color:#fff;
border-radius:99px;font-size:11px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.body{padding:4px 16px 16px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}td.n,th.n{text-align:right}
a{color:var(--accent)}
svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}.lbl{fill:var(--muted);font-size:11px}
.line{fill:none;stroke:var(--accent);stroke-width:2}.dot{fill:var(--accent)}
.dot.min{fill:var(--good)}
h3{font-size:13px;color:var(--muted);margin:12px 0 0;font-weight:500}
@media (max-width:640px){.head{display:none}
summary{grid-template-columns:1fr 1fr}.name{grid-column:1/-1}}
</style></head>
<body><main>
<h1>Price tracker</h1>
<p class="sub">Atualizado em — · clica num produto para ver as lojas e o gráfico</p>
<div class="head"><div>Produto</div><div>Melhor preço</div><div>Mínimo histórico</div><div>vs. dia anterior</div></div>
<p>Ainda não há dados.</p>
</main></body></html>
